name: Update profile art

# Redraws the contribution graph and README cards from live public data.
# Daily at 06:17 UTC, on demand, and after pushes to main.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: update-profile-art
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --require-hashes -r scripts/requirements.lock.txt

      - name: Fetch public contribution calendar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PROFILE_USER: ParthD25
        run: python scripts/fetch_contributions.py

      - name: Render README cards
        run: python scripts/render_readme_cards.py

      - name: Commit updated art
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5.2.0
        with:
          commit_message: "chore: refresh contribution cards [skip ci]"
          file_pattern: "data/contributions.json cards/*.svg"
