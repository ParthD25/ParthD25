<svg xmlns="http://www.w3.org/2000/svg" width="880.000" height="64" viewBox="0 0 880.000 64" role="img" aria-label="Featured work"><title>Featured work</title><style>@font-face{font-family:'Space Grotesk';font-style:normal;font-weight:700;src:url(data:font/woff;base64,) format('woff')}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}70%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.28}}
@keyframes nudge{0%,100%{transform:none}50%{transform:translateX(4px)}}
@keyframes nudgeup{0%,100%{transform:none}50%{transform:translate(3px,-3px)}}
.r{opacity:0;animation:rise .7s cubic-bezier(.16,1,.3,1) both;transform-box:fill-box}
.f{opacity:0;animation:fade .8s ease-out both}
.g{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:grow .8s cubic-bezier(.16,1,.3,1) both}
.p{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .35s ease-out both}
.live{animation:pulse 1.6s ease-in-out infinite}
.n{transform-box:fill-box;animation:nudge 1.8s ease-in-out infinite}
.nu{transform-box:fill-box;animation:nudgeup 1.8s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){
  .r,.f,.g,.p,.live,.n,.nu{animation:none!important;opacity:1!important;transform:none!important}
}
</style>
<rect width="880" height="56" rx="16" fill="#070d1a"/><rect x="0.75" y="0.75" width="878.5" height="54.5" rx="15.2" fill="none" stroke="#22304d" stroke-width="1"/>
<text class="r" style="animation-delay:1.20s" x="28" y="36" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="700" font-size="22" fill="#e8ecf3">Featured work</text>
</svg>